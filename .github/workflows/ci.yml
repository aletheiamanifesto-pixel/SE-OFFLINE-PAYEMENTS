name: CI — AEGIS Offline Payments

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: "🧪 Test Python SE Simulator"

    steps:
      - name: 📥 Checkout codice
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installa dipendenze
        run: pip install -e ".[dev]"

      - name: 🧪 Esegui test con pytest
        run: python -m pytest tests/ -v

      - name: 🚀 Esegui dimostrazione pagamento (protocollo v1)
        run: python host_app/python/payment_flow.py

      - name: 🎬 Esegui demo completa (protocollo v2)
        run: python demo.py

      - name: 🕶️ Esegui demo modalità privacy (firma cieca)
        run: python demo_privacy.py

  applet:
    runs-on: ubuntu-latest
    name: "💳 Test Applet JavaCard (jCardSim)"

    steps:
      - name: 📥 Checkout codice
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: 🧪 Esegui test dell'applet
        working-directory: applet
        run: gradle test --console=plain
