name: CI — Test e Validazione

on:
  push:
    branches: [ "main", "master", "develop", "copilot/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:

  # ── Python: test, lint ──────────────────────────────────────────────────────
  python-tests:
    name: "🐍 Python Tests"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pytest pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --tb=short \
            --cov=host-app/python \
            --cov=bridge \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml

  # ── Esecuzione scenario caffè ───────────────────────────────────────────────
  scenario-demo:
    name: "☕ Scenario Demo"
    runs-on: ubuntu-latest
    needs: python-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install cryptography

      - name: Run coffee scenario
        run: python examples/scenario_caffe.py

      - name: Run payment flow
        run: python host-app/python/payment_flow.py --alice 100 --bob 50 --amount 25 --quiet

  # ── Verifica documentazione ─────────────────────────────────────────────────
  docs-check:
    name: "📚 Documentation Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required docs exist
        run: |
          echo "Verifica file documentazione..."
          for doc in \
            README.md \
            docs/01_COME_FUNZIONA.md \
            docs/02_FLUSSO_APDU.md \
            docs/03_SICUREZZA.md \
            docs/04_HARDWARE_GUIDA.md; do
            if [ -f "$doc" ]; then
              echo "✅ $doc"
            else
              echo "❌ MANCANTE: $doc"
              exit 1
            fi
          done

      - name: Check required source files exist
        run: |
          echo "Verifica file sorgente..."
          for src in \
            host-app/python/se_simulator.py \
            host-app/python/payment_flow.py \
            bridge/reconciliation_bridge.py \
            tests/test_payment_flow.py \
            examples/scenario_caffe.py \
            applet/src/main/java/com/aegis/se/OfflineDigitalEuroApplet.java \
            applet/src/main/java/com/aegis/se/WalletState.java \
            applet/src/main/java/com/aegis/se/CryptoManager.java \
            applet/src/main/java/com/aegis/se/APDUConstants.java \
            applet/src/main/java/com/aegis/se/MonotonicCounter.java; do
            if [ -f "$src" ]; then
              echo "✅ $src"
            else
              echo "❌ MANCANTE: $src"
              exit 1
            fi
          done

  # ── Check sintassi Java (senza compilazione completa) ──────────────────────
  java-syntax:
    name: "☕ Java Syntax Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Check Java files structure
        run: |
          echo "File Java trovati:"
          find applet/src -name "*.java" | sort
          echo ""
          echo "Verifica package declarations..."
          for f in applet/src/main/java/com/aegis/se/*.java; do
            if grep -q "^package com.aegis.se;" "$f"; then
              echo "✅ $(basename $f)"
            else
              echo "⚠️  Package declaration non trovata in: $f"
            fi
          done

  # ── Riepilogo CI ────────────────────────────────────────────────────────────
  ci-summary:
    name: "📊 CI Summary"
    runs-on: ubuntu-latest
    needs: [python-tests, scenario-demo, docs-check, java-syntax]
    if: always()

    steps:
      - name: CI Result
        run: |
          echo "════════════════════════════════════════"
          echo "  SE-OFFLINE-PAYMENTS CI Summary"
          echo "════════════════════════════════════════"
          echo "  Python Tests:    ${{ needs.python-tests.result }}"
          echo "  Scenario Demo:   ${{ needs.scenario-demo.result }}"
          echo "  Docs Check:      ${{ needs.docs-check.result }}"
          echo "  Java Syntax:     ${{ needs.java-syntax.result }}"
          echo "════════════════════════════════════════"

          # Fallisci se qualcuno dei job precedenti è fallito
          if [[ "${{ needs.python-tests.result }}"  != "success" ]] || \
             [[ "${{ needs.scenario-demo.result }}"  != "success" ]] || \
             [[ "${{ needs.docs-check.result }}"     != "success" ]] || \
             [[ "${{ needs.java-syntax.result }}"    != "success" ]]; then
            echo "❌ CI FALLITA"
            exit 1
          fi
          echo "✅ CI SUPERATA"
